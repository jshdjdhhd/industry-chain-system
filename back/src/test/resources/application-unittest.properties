# 集成测试专用配置：H2 内存库（MySQL 兼容模式），避免依赖真实 MySQL
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
security.jwt.secret=unit-test-secret-strong-enough-for-hs256-signing-key-xxxxxx
security.jwt.expiration=7200
security.cors.allowed-origins[0]=http://localhost:5173
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
logging.level.root=WARN
logging.level.git.ggwzz=DEBUG